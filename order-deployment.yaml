apiVersion: apps/v1
kind: Deployment

metadata:
  name: order-service
  namespace: cloudcart

spec:
  replicas: 2

  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service

    spec:
      containers:
      - name: order-service
        image: 114171679862.dkr.ecr.us-east-1.amazonaws.com/order-service:v1
        imagePullPolicy: Always

        ports:
        - containerPort: 5003