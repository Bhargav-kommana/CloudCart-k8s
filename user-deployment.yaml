apiVersion: apps/v1
kind: Deployment

metadata:
  name: user-service
  namespace: cloudcart

spec:
  replicas: 1

  selector:
    matchLabels:
      app: user-service

  template:
    metadata:
      labels:
        app: user-service

    spec:
      containers:
      - name: user-service

        image: 114171679862.dkr.ecr.us-east-1.amazonaws.com/user-service:v1

        ports:
        - containerPort: 5001

        imagePullPolicy: Always